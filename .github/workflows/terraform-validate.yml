name: Terraform Validate & Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: 1.9.8
  AWS_REGION: us-east-1
  # certificate_arn is a required variable with no default, by design: the ECS
  # module has no plaintext listener. See docs/adr/0006-mandatory-tls.md.
  TF_VAR_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plan and apply need a real role. Without AWS_ACCOUNT_ID the ARN renders as
  # arn:aws:iam:::role/... and the run fails with "Request ARN is invalid",
  # which reads like a broken workflow rather than unconfigured credentials.
  aws-preflight:
    name: AWS Configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "${ACCOUNT_ID}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Terraform plan and apply skipped"
              echo
              echo "\`AWS_ACCOUNT_ID\` is not set. Validation, formatting and"
              echo "linting still ran and still gate this pull request; only the"
              echo "steps that need live credentials were skipped."
              echo
              echo "Enable with \`./scripts/bootstrap.sh\`, then apply"
              echo "\`terraform/environments/dev\`, then set the secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate all modules
        run: |
          # The previous version used `cd -`, which prints the directory and
          # breaks as soon as one module fails, masking the rest. This reports
          # every module and fails once at the end.
          status=0
          for dir in terraform/modules/*/; do
            [ -f "${dir}main.tf" ] || continue
            echo "::group::${dir}"
            if ! (cd "${dir}" && terraform init -backend=false -no-color && terraform validate -no-color); then
              echo "::error::terraform validate failed for ${dir}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Validate all environments
        run: |
          status=0
          for dir in terraform/environments/*/; do
            [ -f "${dir}main.tf" ] || continue
            echo "::group::${dir}"
            if ! (cd "${dir}" && terraform init -backend=false -no-color && terraform validate -no-color); then
              echo "::error::terraform validate failed for ${dir}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Run tflint
        # --chdir keeps the vendored app/ tree out of scope; see .tflint.hcl.
        run: |
          tflint --init
          tflint --chdir=terraform --recursive --format compact

  plan-dev:
    name: Plan Dev
    runs-on: ubuntu-latest
    needs: [validate, aws-preflight]
    # Planning needs real credentials, which forks never have, and which this
    # account does not have until bootstrap has run.
    if: |
      needs.aws-preflight.outputs.configured == 'true' &&
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push')
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformPlan

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: terraform/environments/dev
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/dev/plan_output.txt', 'utf8');
            // A GitHub comment caps at 65536 characters including the fences,
            // so leave headroom rather than slicing at exactly the limit.
            const max = 60000;
            const truncated = plan.length > max
              ? plan.slice(0, max) + '\n\n...output truncated, see the job log for the full plan.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - Dev\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  plan-staging:
    name: Plan Staging
    runs-on: ubuntu-latest
    needs: [validate, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/staging-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformPlan

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init and plan
        working-directory: terraform/environments/staging
        run: |
          terraform init
          terraform plan -no-color

  apply-dev:
    name: Apply Dev
    runs-on: ubuntu-latest
    needs: [validate, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformApply

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve

  apply-prod:
    name: Apply Prod (Manual Approval)
    runs-on: ubuntu-latest
    needs: [plan-staging, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The production environment must carry a required reviewer in repository
    # settings; that approval gate is what makes this job safe, not the name.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/prod-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformApply

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform plan
        working-directory: terraform/environments/prod
        run: |
          terraform init
          terraform plan -no-color -out=tfplan

      - name: Terraform apply
        working-directory: terraform/environments/prod
        # Applies the reviewed plan file rather than re-resolving state, so what
        # was approved is what gets applied.
        run: terraform apply -no-color tfplan
