name: Container Build & Push

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/app/**'
      - '.github/workflows/container-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/app/**'
      - '.github/workflows/container-build.yml'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  SCAN_IMAGE: local/api:scan

jobs:
  # Build and scan need no cloud credentials, so they run on every PR.
  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src/app/
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Run Grype scan
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.SCAN_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # Publishing needs the AWS OIDC role, so it only runs on branch pushes.
  publish:
    name: Push, Sign & Attest
    needs: build-and-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: dev/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ContainerBuild

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: src/app/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # Sign and attest the digest that actually exists in ECR.
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE"
