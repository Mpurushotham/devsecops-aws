name: DevSecOps Pipeline

# Application build, test and delivery.
#
# Static analysis lives in security-scan.yml and is not repeated here. The
# previous version of this file re-ran GitLeaks, Semgrep, Checkov and tfsec on
# every push, doubling CI time and producing two conflicting verdicts for the
# same commit. It also authenticated with long-lived AWS_ACCESS_KEY_ID secrets
# while every other workflow used OIDC, and built a Dockerfile at the repository
# root that does not exist.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the AWS side of this pipeline can run at all. Without
  # AWS_ACCOUNT_ID the role ARN renders as arn:aws:iam:::role/... and
  # configure-aws-credentials retries twelve times over two and a half minutes
  # before failing with "Request ARN is invalid", which says nothing about the
  # actual cause. This turns that into a clear skip.
  # Whether the AWS side of this pipeline can run. Two conditions, because
  # either one failing produces a misleading error otherwise: without
  # AWS_ACCOUNT_ID the role ARN renders as arn:aws:iam:::role/... and the run
  # dies with "Request ARN is invalid"; with the secret set but before
  # terraform has created the role, it dies with an AssumeRole failure after
  # twelve retries. Neither message points at the real cause.
  aws-preflight:
    name: AWS Configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.verify.outputs.configured }}
    steps:
      - id: secret
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "${ACCOUNT_ID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - id: assume
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-cicd-deploy-role
          aws-region: us-east-1
          role-session-name: Preflight

      - id: verify
        env:
          HAS_SECRET: ${{ steps.secret.outputs.present }}
          ASSUMED: ${{ steps.assume.outcome }}
        run: |
          if [ "${HAS_SECRET}" = "true" ] && [ "${ASSUMED}" = "success" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "AWS reachable; build and deploy jobs will run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS jobs skipped"
            echo
            if [ "${HAS_SECRET}" != "true" ]; then
              echo "\`AWS_ACCOUNT_ID\` is not set."
            else
              echo "\`AWS_ACCOUNT_ID\` is set, but \`dev-cicd-deploy-role\` could not be assumed."
              echo "It is created by \`terraform apply\`, which has not run yet."
            fi
            echo
            echo "Sequence: \`./scripts/bootstrap.sh\`, then apply \`terraform/environments/dev\`,"
            echo "then set the secret. Lint, validation and tests are unaffected and still gate this PR."
          } >> "$GITHUB_STEP_SUMMARY"

  app-test:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/app/requirements.txt

      - name: Install dependencies
        working-directory: src/app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: src/app
        run: ruff check .

      - name: Check formatting
        working-directory: src/app
        run: ruff format --check .

      - name: Static security analysis
        working-directory: src/app
        run: bandit -r . --exclude ./tests --severity-level medium

      - name: Run tests
        working-directory: src/app
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ github.run_number }}
          path: src/app/coverage.xml
          retention-days: 14

  build:
    name: Build & Scan Image
    needs: [app-test, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true'
    # push is false on pull requests: the image is built and scanned so the PR
    # gets a verdict, but nothing reaches ECR until the change is on a branch.
    uses: ./.github/workflows/container-build.yml
    with:
      environment: dev
      push: ${{ github.event_name == 'push' }}
    # Named explicitly rather than `secrets: inherit`, which hands every
    # repository secret to the called workflow whether it needs them or not.
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy-dev:
    name: Deploy Dev
    needs: [build, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
    # Named explicitly rather than `secrets: inherit`, which hands every
    # repository secret to the called workflow whether it needs them or not.
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy-prod:
    name: Deploy Production
    needs: [build, aws-preflight]
    if: needs.aws-preflight.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.build.outputs.image-tag }}
    # Named explicitly rather than `secrets: inherit`, which hands every
    # repository secret to the called workflow whether it needs them or not.
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
