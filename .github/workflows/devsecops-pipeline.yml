name: DevSecOps Pipeline

# Application build, test and delivery.
#
# Static analysis lives in security-scan.yml and is not repeated here. The
# previous version of this file re-ran GitLeaks, Semgrep, Checkov and tfsec on
# every push, doubling CI time and producing two conflicting verdicts for the
# same commit. It also authenticated with long-lived AWS_ACCESS_KEY_ID secrets
# while every other workflow used OIDC, and built a Dockerfile at the repository
# root that does not exist.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-test:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/app/requirements.txt

      - name: Install dependencies
        working-directory: src/app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: src/app
        run: ruff check .

      - name: Check formatting
        working-directory: src/app
        run: ruff format --check .

      - name: Static security analysis
        working-directory: src/app
        run: bandit -r . --exclude ./tests --severity-level medium

      - name: Run tests
        working-directory: src/app
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_number }}
          path: src/app/coverage.xml
          retention-days: 14

  build:
    name: Build & Scan Image
    needs: app-test
    # push is false on pull requests: the image is built and scanned so the PR
    # gets a verdict, but nothing reaches ECR until the change is on a branch.
    uses: ./.github/workflows/container-build.yml
    with:
      environment: dev
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  deploy-dev:
    name: Deploy Dev
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit

  deploy-prod:
    name: Deploy Production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit
