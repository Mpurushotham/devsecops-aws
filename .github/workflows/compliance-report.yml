name: Compliance Report

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AWS_REGION: us-east-1

jobs:
  generate-report:
    name: Generate Compliance Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/prod-security-auditor
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ComplianceReport

      - name: Collect Security Hub summary
        id: securityhub
        run: |
          aws securityhub get-findings \
            --filters '{"RecordState":[{"Value":"ACTIVE","Comparison":"EQUALS"}],"WorkflowStatus":[{"Value":"NEW","Comparison":"EQUALS"}]}' \
            --query 'Findings[].{Severity:Severity.Label,Title:Title,AccountId:AwsAccountId}' \
            --output json > securityhub-findings.json
          echo "total=$(jq length securityhub-findings.json)" >> "$GITHUB_OUTPUT"

      - name: Collect Config compliance
        run: |
          # shellcheck disable=SC2016
          # The backticks are JMESPath literal syntax, not command substitution,
          # and must stay inside single quotes for the query to parse.
          aws configservice describe-compliance-by-config-rule \
            --query 'ComplianceByConfigRules[?Compliance.ComplianceType!=`COMPLIANT`]' \
            --output json > config-noncompliant.json

      - name: Collect GuardDuty findings
        run: |
          DETECTOR="$(aws guardduty list-detectors --query 'DetectorIds[0]' --output text)"
          if [ "${DETECTOR}" = "None" ] || [ -z "${DETECTOR}" ]; then
            echo "No GuardDuty detector in this account/region" >&2
            echo '{"FindingIds":[]}' > guardduty-findings.json
            exit 0
          fi
          aws guardduty list-findings \
            --detector-id "${DETECTOR}" \
            --finding-criteria '{"Criterion":{"severity":{"Gte":7}}}' \
            --output json > guardduty-findings.json

      - name: Generate markdown report
        run: |
          # Values are computed into shell variables first and the heredoc is
          # left unquoted. The previous version used a quoted heredoc, so every
          # $(...) was written to the report verbatim instead of being expanded.
          generated_at="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sh_by_severity="$(jq -c '[.[] | {Severity}] | group_by(.Severity)
                                    | map({severity: .[0].Severity, count: length})' \
                            securityhub-findings.json)"
          config_rules="$(jq -c '[.[] | {Rule: .ConfigRuleName, Status: .Compliance.ComplianceType}]' \
                          config-noncompliant.json)"
          gd_count="$(jq '.FindingIds | length' guardduty-findings.json)"

          cat > compliance-report.md <<REPORT
          # Weekly Compliance Report

          **Generated:** ${generated_at}
          **Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Security Hub findings by severity

          \`\`\`json
          ${sh_by_severity}
          \`\`\`

          ## Config non-compliant rules

          \`\`\`json
          ${config_rules}
          \`\`\`

          ## High severity GuardDuty findings

          ${gd_count} findings at severity 7 or above.
          REPORT

          cat compliance-report.md

      - name: Create GitHub issue for findings
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        if: steps.securityhub.outputs.total != '0'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('compliance-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Compliance Report - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['compliance', 'security', 'automated']
            });

      - name: Upload reports as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compliance-reports-${{ github.run_number }}
          path: |
            securityhub-findings.json
            config-noncompliant.json
            guardduty-findings.json
            compliance-report.md
          retention-days: 90
